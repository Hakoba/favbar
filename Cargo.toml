[package]
name = "favbar"
version = "0.1.1"
edition = "2021"
description = "A lightweight Windows Explorer sidebar"
license = "MIT"
build = "build.rs"

[dependencies]
serde_json = "1"
glob = "0.3"
url = "2"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
